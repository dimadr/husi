name: Android Mieru Integrated

on:
  push:
    branches:
      - feature/mieru-builtin
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LOCAL_RELEASE_SIZE: '41462619'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/load-build-versions
      - uses: ./.github/actions/setup-ndk
      - uses: ./.github/actions/setup-jbr
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: ./.github/actions/go-android-cache
      - uses: ./.github/actions/gradle-cache
        with:
          build-cache-name: android-mieru-integrated
      - name: Verify Mieru source version
        run: |
          git fetch --no-tags --depth=1 origin dev
          dev_sha="$(git rev-parse FETCH_HEAD)"
          git diff --quiet "$dev_sha" -- husi.properties
          source husi.properties
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          [[ "$MIERU_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]
          [[ "$MIERU_VERSION" =~ ^[0-9]+$ ]]
          expected_sha="$(git ls-tree --format='%(objectname)' "$dev_sha" plugin/mieru/src/main/go/mieru)"
          feature_sha="$(git ls-tree --format='%(objectname)' HEAD plugin/mieru/src/main/go/mieru)"
          actual_sha="$(git -C plugin/mieru/src/main/go/mieru rev-parse HEAD)"
          test "$feature_sha" = "$expected_sha"
          test "$actual_sha" = "$expected_sha"
          mieru_source_version="${MIERU_VERSION_NAME%-*}"
          git -C plugin/mieru/src/main/go/mieru fetch --depth=1 origin \
            "refs/tags/v${mieru_source_version}:refs/tags/v${mieru_source_version}"
          test "$(git -C plugin/mieru/src/main/go/mieru describe --tags --exact-match)" = "v${mieru_source_version}"
          {
            echo "HUSI_DEV_SHA=$dev_sha"
            echo "HUSI_VERSION_NAME=$VERSION_NAME"
            echo "HUSI_VERSION_CODE=$VERSION_CODE"
            echo "MIERU_SOURCE_VERSION=$mieru_source_version"
            echo "MIERU_SUBMODULE_SHA=$actual_sha"
          } >> "$GITHUB_ENV"
      - name: Cache route assets
        id: cache-assets
        uses: actions/cache@v6
        with:
          path: composeApp/src/commonMain/composeResources/files/sing-box
          key: >-
            assets-v2-${{ env.GEOIP_VERSION }}-${{ env.GEOSITE_VERSION }}-${{ hashFiles('buildScript/lib/assets.sh', 'libcore/cmd/internal/ruleset_generate/**', 'libcore/go.mod', 'libcore/go.sum') }}
      - name: Prepare assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: make assets
      - name: Build Android libcore
        run: make libcore_android
      - name: Build optimized unsigned ARM64 Release APK with embedded Mieru
        id: release
        run: |
          set -euo pipefail
          make apk_mieru_release_unsigned_ci 2>&1 | tee "$RUNNER_TEMP/mieru-release-build.log"
          for task in minifyFossReleaseWithR8 optimizeFossReleaseResources; do
            grep -Ex "> Task :androidApp:$task( (FROM-CACHE|UP-TO-DATE))?" "$RUNNER_TEMP/mieru-release-build.log"
          done
          test -s androidApp/build/outputs/mapping/fossRelease/mapping.txt
      - name: Verify and stage the single unsigned Release APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find androidApp/build/outputs/apk/foss/release -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          printf 'APK: %s\n' "$apk"
          [[ "$apk" == *arm64-v8a*.apk ]]
          mkdir -p artifact
          aapt2="$(find "${ANDROID_HOME:?}/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt2 | sort -V | tail -n 1)"
          test -x "$aapt2"
          "$aapt2" dump badging "$apk" | tee artifact/badging.txt
          grep -Fq "package: name='fr.husi.mieru' versionCode='${HUSI_VERSION_CODE}' versionName='${HUSI_VERSION_NAME}'" artifact/badging.txt
          grep -Fxq "native-code: 'arm64-v8a'" artifact/badging.txt
          if grep -Fxq 'application-debuggable' artifact/badging.txt; then
            echo '::error::Release APK is debuggable.'
            exit 1
          fi
          "$aapt2" dump xmltree "$apk" --file AndroidManifest.xml > artifact/manifest.txt
          python3 - "$apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              assert archive.testzip() is None, "ZIP integrity failure"
              names = archive.namelist()
              assert len(names) == len(set(names)), "Duplicate ZIP entries"
              assert names.count("AndroidManifest.xml") == 1, "Missing manifest"
              assert names.count("lib/arm64-v8a/libmieru.so") == 1, "Missing Mieru"
              assert all(not n.startswith("lib/") or n.startswith("lib/arm64-v8a/") for n in names), "Unexpected ABI"
              assert not any(n.upper().startswith("META-INF/") and n.upper().endswith((".SF", ".RSA", ".DSA", ".EC", "MANIFEST.MF")) for n in names), "JAR signing material"
              with open(sys.argv[1], "rb") as apk_file:
                  apk_file.seek(archive.start_dir - 16)
                  assert apk_file.read(16) != b"APK Sig Block 42", "APK signing block present"
          PY
          apksigner="$(dirname "$aapt2")/apksigner"
          if "$apksigner" verify --verbose --print-certs "$apk" > artifact/unsigned-check.txt 2>&1; then
            echo '::error::Unsigned CI artifact has a valid signature.'
            exit 1
          fi
          cat artifact/unsigned-check.txt
          grep -Fxq 'DOES NOT VERIFY' artifact/unsigned-check.txt
          mapfile -t errors < <(grep '^ERROR:' artifact/unsigned-check.txt)
          test "${#errors[@]}" -eq 1
          test "${errors[0]}" = 'ERROR: Missing META-INF/MANIFEST.MF'
          test "$(git -C plugin/mieru/src/main/go/mieru rev-parse HEAD)" = "$MIERU_SUBMODULE_SHA"
          unzip -p "$apk" lib/arm64-v8a/libmieru.so > "$RUNNER_TEMP/mieru-apk.so"
          test -s "$RUNNER_TEMP/mieru-apk.so"
          go version -m "$RUNNER_TEMP/mieru-apk.so" | tee artifact/mieru-build-metadata.txt
          grep -Fq 'GOARCH=arm64' artifact/mieru-build-metadata.txt
          grep -Fq 'GOOS=android' artifact/mieru-build-metadata.txt
          staged="artifact/husi-${HUSI_VERSION_NAME}-mieru-${MIERU_SOURCE_VERSION}-arm64-v8a-unsigned.apk"
          cp "$apk" "$staged"
          bytes="$(stat -c %s "$staged")"
          mib="$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1048576 }')"
          apk_sha="$(sha256sum "$staged" | cut -d ' ' -f 1)"
          mieru_sha="$(sha256sum "$RUNNER_TEMP/mieru-apk.so" | cut -d ' ' -f 1)"
          difference=$((bytes - LOCAL_RELEASE_SIZE))
          if [[ "$((difference < 0 ? -difference : difference))" -gt "$((LOCAL_RELEASE_SIZE / 10))" ]]; then
            echo '::warning::Release size differs by more than 10% from the local reference; investigate the verification report.'
          fi
          {
            printf 'Variant: fossRelease\nPackage: fr.husi.mieru\nVersion: %s / %s\nABI: arm64-v8a\n' "$HUSI_VERSION_NAME" "$HUSI_VERSION_CODE"
            printf 'APK: %s\nAPK bytes: %s\nAPK MiB: %s\nLocal reference bytes: %s\nDifference bytes: %s\n' "$staged" "$bytes" "$mib" "$LOCAL_RELEASE_SIZE" "$difference"
            printf 'APK SHA256: %s\nMieru SHA256: %s\nSigning status: UNSIGNED\n' "$apk_sha" "$mieru_sha"
            printf 'Mieru version: %s\nMieru submodule: %s\nUpstream dev: %s\n' "$MIERU_SOURCE_VERSION" "$MIERU_SUBMODULE_SHA" "$HUSI_DEV_SHA"
            printf 'R8: minifyFossReleaseWithR8\nResource shrinking: optimizeFossReleaseResources\n'
          } | tee artifact/verification.txt
          cat artifact/verification.txt >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/mieru-release-build.log" artifact/
      - uses: actions/upload-artifact@v7
        with:
          name: husi-mieru-unsigned-release-arm64
          path: artifact/
          if-no-files-found: error
      - name: Preserve failure build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: husi-mieru-unsigned-release-failure-log
          path: ${{ runner.temp }}/mieru-release-build.log
          if-no-files-found: ignore
